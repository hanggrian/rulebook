[tool.uv.workspace]
members = [
  "rulebook-cppcheck",
  "rulebook-pylint",
  "codecheck-py",
  "testing-pylint",
  "stress-test-py",
]

[tool.uv.sources]
rulebook-cppcheck = { workspace = true }
rulebook-pylint = { workspace = true }
testing-pylint = { workspace = true }

[tool.poe.tasks]
lint1 = "cppcheck --enable=all --suppress=checkersReport --suppress=missingIncludeSystem --suppress=missingInclude --addon=addon.json sample/c/*.c sample/cpp/*.cpp"
lint2 = "cppcheck --enable=all --suppress=checkersReport --suppress=missingIncludeSystem --addon=sample-configured/custom_addon.json sample-configured/c/*.c sample-configured/cpp/*.cpp"
lint3 = "pylint rulebook-cppcheck/"
lint4 = "pylint rulebook-pylint/"
lint5 = "pylint testing-pylint/testing/"
lint6 = "pylint stress-test-py/tests/"
lint7 = "pylint sample/"
lint8 = "pylint sample-configured/ --rcfile=sample-configured/custom_pylintrc"
lint9 = "stylebook ."
lint.parallel = [
  "lint1",
  "lint2",
  "lint3",
  "lint4",
  "lint5",
  "lint6",
  "lint7",
  "lint8",
  "lint9",
]
test1 = "pytest rulebook-cppcheck/"
test2 = "pytest rulebook-pylint/"
test3 = "pytest stress-test-py/"
test = ["test1", "test2", "test3"]
cov1 = "pytest rulebook-cppcheck/ --cov=rulebook-cppcheck"
cov2 = "pytest rulebook-pylint/ --cov=rulebook-pylint --cov-append"
cov3 = "coverage xml"
cov = ["cov1", "cov2", "cov3"]
doc1 = "rm -rf build/pdoc/"
doc2 = "pdoc -o build/pdoc/ rulebook-pylint/rulebook_pylint/ rulebook-cppcheck/rulebook_cppcheck/"
doc = ["doc1", "doc2"]

[tool.coverage.run]
omit = ["*/tests/*"]

[dependency-groups]
dev = [
  "poethepoet",
  "pdoc",
  # lint
  "stylebook",
  # test
  "pytest",
  "pytest-cov",
]
