name: Setup Workspace
description: Checkout and install all dependencies

runs:
  using: composite
  steps:
  - uses: actions/setup-go@v7
    with:
      go-version: 1.27
      cache: true

  - uses: actions/setup-java@v6
    with:
      distribution: temurin
      java-version: 21
      cache: gradle

  - uses: astral-sh/setup-uv@v10.3.0
    with:
      python-version: 3.15
      enable-cache: true

  - uses: pnpm/action-setup@v6
    with:
      version: 12

  - uses: actions/setup-node@v7
    with:
      node-version: lts/*
      cache: pnpm

  - uses: extractions/setup-just@v4

  - shell: bash
    run: just install true
